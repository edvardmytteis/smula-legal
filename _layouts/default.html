<!doctype html>
<html lang="{{ page.lang | default: 'nb' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · Smula</title>
<style>
:root { --bg: #F5F6F4; --text: #1B1E1C; --muted: #5B625E; --accent: #2F5D46; --border: #D9DDD9; }
@media (prefers-color-scheme: dark) { :root { --bg: #121513; --text: #ECEFEC; --muted: #A4ACA7; --accent: #6FAE8B; --border: #343A36; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; }
h2 { font-size: 21px; margin: 36px 0 8px; }
a { color: var(--accent); }
table { border-collapse: collapse; width: 100%; font-size: 15px; display: block; overflow-x: auto; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
p, li { color: var(--text); }
</style>
</head>
<body><main>{{ content }}</main></body>
</html>
